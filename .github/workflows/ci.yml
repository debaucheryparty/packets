name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          gofumpt -l .
          test -z "$(gofumpt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          skip-cache: true

      - name: Test
        run: go test ./... -race
