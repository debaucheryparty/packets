name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y genisoimage zip
      - name: Build
        run: make release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/*.exe
            bin/*.dmg
            bin/*.deb
            bin/*.tar.gz
            bin/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
