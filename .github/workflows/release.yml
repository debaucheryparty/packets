name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: make release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/packets-*
            bin/packetsd-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
