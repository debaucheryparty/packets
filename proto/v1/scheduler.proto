syntax = "proto3";
package packets.v1;

option go_package = "github.com/debaucheryparty/packets/proto/v1";

service Scheduler {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc StreamJobLogs(StreamJobLogsRequest) returns (stream JobLogLine);
  rpc ClearCache(ClearCacheRequest) returns (ClearCacheResponse);
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream ArtifactChunk);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc RegisterWorkerStream(stream WorkerMsg) returns (stream SchedulerMsg);
}

message ClearCacheRequest {
  string toolchain = 1;
}

message ClearCacheResponse {
  int32 cleared_count = 1;
}

message SubmitJobRequest {
  string cache_key = 1;
  string toolchain = 2;
  string snapshot_ref = 3;
  string docker_image = 4;
  string runner = 5;
  string source_mode = 6;
  repeated string command_args = 7;
  repeated string artifact_paths = 8;
  string project_id = 9;
  string approval_ticket = 10;
}

message SubmitJobResponse {
  string job_id = 1;
  bool cache_hit = 2;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  JobState state = 1;
  string artifact_ref = 2;
  string error_message = 3;
}

message StreamJobLogsRequest {
  string job_id = 1;
}

message JobLogLine {
  string content = 1;
}

message DownloadArtifactRequest {
  string job_id = 1;
}

message ArtifactChunk {
  bytes data = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  bool cancelled = 1;
  string message = 2;
}

message ListJobsRequest {
  int32 limit = 1;
  string state = 2;
}

message JobSummary {
  string job_id = 1;
  string toolchain = 2;
  string runner = 3;
  JobState state = 4;
  int64 submitted_at_unix = 5;
  string owner = 6;
  string error_message = 7;
}

message ListJobsResponse {
  repeated JobSummary jobs = 1;
}

message WorkerMsg {
  oneof payload {
    WorkerHello hello = 1;
    WorkerHeartbeat heartbeat = 2;
    WorkerJobResult result = 3;
    WorkerJobLog log = 4;
  }
}

message WorkerHello {
  string worker_id = 1;
  string node_name = 2;
  string arch = 3;
  int32 cores = 4;
  int32 max_jobs = 5;
  bool docker_only = 6;
}

message WorkerHeartbeat {
  string worker_id = 1;
}

message WorkerJobResult {
  string job_id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  string error_message = 5;
}

message WorkerJobLog {
  string job_id = 1;
  string line = 2;
}

message SchedulerMsg {
  oneof payload {
    SchedulerAck ack = 1;
    JobAssignment assign = 2;
    JobCancellation cancel = 3;
  }
}

message SchedulerAck {
  bool success = 1;
  string message = 2;
}

message JobAssignment {
  string job_id = 1;
  string toolchain = 2;
  repeated string command_args = 3;
  string snapshot_ref = 4;
  string docker_image = 5;
  string runner = 6;
}

message JobCancellation {
  string job_id = 1;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_UPLOADING = 2;
  JOB_STATE_DISPATCHED = 3;
  JOB_STATE_RUNNING = 4;
  JOB_STATE_SUCCEEDED = 5;
  JOB_STATE_FAILED = 6;
}
