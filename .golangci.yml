version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - gosimple
    - unconvert
    - unparam
    - misspell
    - goimports
    - nolintlint
    - errorlint

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
